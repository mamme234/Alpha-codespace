<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Codespace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>⌨️ Codespace</h1>
                <p>Sign in to your workspace</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary btn-block">Sign In</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="social-login">
                <button class="btn-social btn-github" onclick="handleGithubLogin()">Continue with GitHub</button>
                <button class="btn-social btn-google" onclick="handleGoogleLogin()">Continue with Google</button>
            </div>

            <p class="auth-footer">
                Don't have an account? <a href="/register.html">Sign up</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
  </html>
