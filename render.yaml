services:
  - type: web
    name: codespace-backend
    runtime: node
    repo: https://github.com/yourusername/codespace-web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://codespace-frontend.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health

  - type: web
    name: codespace-frontend
    runtime: static
    repo: https://github.com/yourusername/codespace-web
    plan: free
    buildCommand: echo "Static site ready"
    staticPublishPath: ./frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://codespace-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
